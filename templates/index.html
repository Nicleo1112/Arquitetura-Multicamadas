<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Livraria MVC</title>
</head>
<body class="container mt-5">
    <h1>Busca de Livros</h1>

    <form method="GET" class="row g-3 mb-4">
        <div class="col-md-3">
            <input type="text" name="titulo" class="form-control" placeholder="Título">
        </div>
        <div class="col-md-3">
            <input type="text" name="autor" class="form-control" placeholder="Autor">
        </div>
        <div class="col-md-2">
            <input type="number" name="ano_min" class="form-control" placeholder="Ano Min">
        </div>
        <div class="col-md-2">
            <input type="number" name="ano_max" class="form-control" placeholder="Ano Max">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        </div>
    </form>

    <h2 class="mt-4">Adicionar Livro</h2>
    <form method="POST" action="/adicionar" class="row g-3 mb-4">
        <div class="col-md-4">
            <input type="text" name="titulo" class="form-control" placeholder="Título" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="autor" class="form-control" placeholder="Autor" required>
        </div>
        <div class="col-md-2">
            <input type="number" name="ano" class="form-control" placeholder="Ano" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Adicionar</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Ano</th>
            </tr>
        </thead>
        <tbody>
            {% for livro in livros %}
            <tr>
                <td>{{ livro.Titulo }}</td>
                <td>{{ livro.Autor }}</td>
                <td>{{ livro.Ano }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
